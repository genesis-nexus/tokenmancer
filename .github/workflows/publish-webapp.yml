name: Publish webapp to npm

on:
  push:
    tags:
      - "webapp-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        run: pnpm check

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#webapp-v}"
          PKG_VERSION=$(node -p "require('./packages/webapp/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/webapp/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build (production)
        run: pnpm --filter copilot-tokenometer build:prod

      - name: Publish
        run: pnpm --filter copilot-tokenometer publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
