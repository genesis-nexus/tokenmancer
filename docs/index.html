monospace;font-size:13px;font-weight:700;color:#06070B;background:#9EFF3D;padding:9px 16px;border-radius:3px\" style-hover=\"background:#C9FF8F\">\n        <svg sc-camel-view-box=\"0 0 16 16\" width=\"15\" height=\"15\" fill=\"currentColor\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n        Star on GitHub\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <div style=\"display:flex;align-items:center;gap:64px;max-width:1280px;margin:0 auto;padding:72px 56px 96px;box-sizing:border-box\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:26px;min-width:0\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.14em;color:#9EFF3D;text-transform:uppercase;width:fit-content;padding:6px 12px;border:1px solid #1C3612;border-radius:999px;background:#0D1408\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#9EFF3D\"><\u002Fspan>\n        For GitHub Copilot\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:52px;line-height:1.12;letter-spacing:0.01em;text-wrap:pretty\">See what every prompt really <span style=\"color:#9EFF3D\">costs<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;font-size:18px;line-height:1.6;color:#AEB6C2;max-width:520px;text-wrap:pretty\">A live AI-Credit meter, session replay, and a what-if simulator for Copilot. One shared engine, two ways to run it: a local-first web app, or straight in your editor's sidebar.<\u002Fp>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:6px\">\n        <span style=\"display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#0D1118;border:1px solid #232B39;padding:13px 20px;border-radius:4px;color:#F2EDE1\">\n          <span style=\"color:#5FE86A\">$<\u002Fspan> npx tokenmancer --open\n        <\u002Fspan>\n        <a href=\"#quickstart\" style=\"display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#F2EDE1;border:1px solid #232B39;padding:13px 22px;border-radius:4px\" style-hover=\"border-color:#9EFF3D;color:#9EFF3D\">Get the VS Code extension →<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C6472\">Runs on your machine. Prompt text redacted by default — only counts and costs leave the parser.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:none;width:340px;height:340px;display:flex;align-items:center;justify-content:center;position:relative\">\n      <div style=\"position:absolute;inset:0;background:radial-gradient(circle, rgba(158,255,61,0.16), transparent 70%)\"><\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 128 128\" style=\"width:280px;height:280px;position:relative;filter:drop-shadow(0 0 40px rgba(158,255,61,0.3))\">\n        <circle cx=\"15\" cy=\"27\" r=\"7.5\" fill=\"#9EFF3D\"><\u002Fcircle>\n        <circle cx=\"15\" cy=\"27\" r=\"3\" fill=\"#06070B\"><\u002Fcircle>\n        <circle cx=\"115\" cy=\"36\" r=\"5\" fill=\"#9EFF3D\"><\u002Fcircle>\n        <circle cx=\"103\" cy=\"13\" r=\"3\" fill=\"#9EFF3D\"><\u002Fcircle>\n        <path d=\"M64 8 L104 42 L106 114 L86 103 L64 116 L42 103 L22 114 L24 42 Z\" fill=\"#F2EDE1\"><\u002Fpath>\n        <path d=\"M64 28 L90 52 L88 94 L64 105 L40 94 L38 52 Z\" fill=\"#06070B\"><\u002Fpath>\n        <path d=\"M48 61 L64 68 L57 79 L45 71 Z\" fill=\"#9EFF3D\"><\u002Fpath>\n        <path d=\"M80 61 L64 68 L71 79 L83 71 Z\" fill=\"#9EFF3D\"><\u002Fpath>\n        <path d=\"M56 90 L72 90 L68 97 L60 97 Z\" fill=\"#9EFF3D\" opacity=\"0.55\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WHAT IT COSTS -->\n  <div style=\"max-width:1280px;margin:0 auto;padding:0 56px 100px;box-sizing:border-box\">\n    <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:44px;display:flex;gap:56px;align-items:center;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;color:#9EFF3D;text-transform:uppercase\">Every prompt is a loop<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:26px;line-height:1.3;text-wrap:pretty\">Plan → read → search → edit → verify<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;line-height:1.65;color:#AEB6C2;text-wrap:pretty\">Tokenmancer reads Copilot's own agent debug log and lays each loop out as a priced, step-by-step timeline: which model ran each step, the context window growing call after call, and a cost bar splitting every bill into cache-read, cache-write, fresh-input, and output — where output, just a few hundred tokens, is routinely the biggest slice.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5C6472;letter-spacing:0.08em;text-transform:uppercase\">\n          <span>Step 4 · edit<\u002Fspan><span>$0.0412<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;height:34px;border-radius:4px;overflow:hidden;width:100%\">\n          <div style=\"width:38%;background:#3BE7FF\"><\u002Fdiv>\n          <div style=\"width:22%;background:#B47CFF\"><\u002Fdiv>\n          <div style=\"width:18%;background:#9EFF3D\"><\u002Fdiv>\n          <div style=\"width:22%;background:#FFC13D\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A93A3\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#3BE7FF\"><\u002Fspan>cache-read<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#B47CFF\"><\u002Fspan>cache-write<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#9EFF3D\"><\u002Fspan>fresh-input<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#FFC13D\"><\u002Fspan>output<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SURFACES -->\n  <div id=\"surfaces\" style=\"max-width:1280px;margin:0 auto;padding:0 56px 100px;box-sizing:border-box;scroll-margin-top:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:40px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;color:#9EFF3D;text-transform:uppercase\">Surfaces<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:30px\">Three views into the same run<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n      <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"width:40px;height:40px;border-radius:6px;background:#0D1408;border:1px solid #1C3612;display:flex;align-items:center;justify-content:center\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#9EFF3D;box-shadow:0 0 10px #9EFF3D\"><\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:19px;font-weight:700;color:#F2EDE1\">Live Meter<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A3\">Tails a Copilot log and prices each agent loop as it happens.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"width:40px;height:40px;border-radius:6px;background:#12101B;border:1px solid #2E2247;display:flex;align-items:center;justify-content:center\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#B47CFF\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 3\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:19px;font-weight:700;color:#F2EDE1\">Session Replay<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A3\">Browse past sessions on this machine by date and replay any of them — great for debugging a run after the fact.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"width:40px;height:40px;border-radius:6px;background:#1A1408;border:1px solid #4A3A10;display:flex;align-items:center;justify-content:center\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#FFC13D\" stroke-width=\"2\"><path d=\"M4 19h16M8 15l3-6 3 4 3-9\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:19px;font-weight:700;color:#F2EDE1\">What-if Simulator<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A3\">Paste text → exact o200k token counts → model the AI-Credit cost across every model, with cache and output levers.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- QUICK START -->\n  <div id=\"quickstart\" style=\"max-width:1280px;margin:0 auto;padding:0 56px 100px;box-sizing:border-box;scroll-margin-top:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:40px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;color:#9EFF3D;text-transform:uppercase\">Quick start<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:30px\">Two ways to run it<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n      <div style=\"background:#0D1118;border:1px solid #232B39;border-radius:6px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:16px 22px;border-bottom:1px solid #232B39;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;color:#8A93A3;text-transform:uppercase\">Web app · no install<\u002Fdiv>\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.9;color:#D6DCE5\">\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> npx tokenmancer --open <span style=\"color:#5C6472\"># once published to npm<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 22px 22px;display:flex;flex-direction:column;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.9;color:#D6DCE5\">\n          <div style=\"color:#5C6472;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px\">From this repo<\u002Fdiv>\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> pnpm install<\u002Fdiv>\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> pnpm start <span style=\"color:#5C6472\"># builds + runs, prints the URL<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> pnpm meter <span style=\"color:#5C6472\"># same, opens the browser<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0D1118;border:1px solid #232B39;border-radius:6px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:16px 22px;border-bottom:1px solid #232B39;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;color:#8A93A3;text-transform:uppercase\">VS Code extension<\u002Fdiv>\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.9;color:#D6DCE5\">\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> pnpm --filter tokenmancer package<\u002Fdiv>\n          <div><span style=\"color:#5FE86A\">$<\u002Fspan> code --install-extension packages/extension/dist/tokenmancer.vsix<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 22px 22px;font-size:13.5px;line-height:1.7;color:#8A93A3\">The <strong style=\"color:#F2EDE1\">Tokenmancer<\u002Fstrong> activity-bar view meters the current workspace; the command palette opens Session Replay, the Simulator, or points the meter at another workspace.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:24px 0 0;font-size:13.5px;line-height:1.7;color:#8A93A3\">Enable Copilot's agent debug log first — <code style=\"font-family:'JetBrains Mono',monospace;background:#0D1118;border:1px solid #232B39;padding:2px 6px;border-radius:3px;color:#D6DCE5\">github.copilot.chat.agentDebugLog.enabled<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;background:#0D1118;border:1px solid #232B39;padding:2px 6px;border-radius:3px;color:#D6DCE5\">.fileLogging.enabled<\u002Fcode> in VS Code settings.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ARCHITECTURE -->\n  <div id=\"architecture\" style=\"max-width:1280px;margin:0 auto;padding:0 56px 100px;box-sizing:border-box;scroll-margin-top:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:40px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;color:#9EFF3D;text-transform:uppercase\">Architecture<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:30px\">One engine, two surfaces<\u002Fh2>\n      <p style=\"margin:6px 0 0;font-size:15px;line-height:1.65;color:#AEB6C2;max-width:640px;text-wrap:pretty\">A pnpm/TypeScript monorepo. The reuse axis is runtime capability, not product surface — both apps compose the same libraries.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:stretch\">\n      <div style=\"background:#0D1118;border:1px solid #232B39;border-radius:6px;padding:26px 28px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:2;color:#D6DCE5\">\n        <div style=\"color:#9EFF3D\">packages/<\u002Fdiv>\n        <div>&nbsp;&nbsp;core/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#5C6472\">pricing model, AIC math, log parser, o200k tokenizer<\u002Fspan><\u002Fdiv>\n        <div>&nbsp;&nbsp;node-host/&nbsp;<span style=\"color:#5C6472\">workspace/log discovery, jsonl tailer<\u002Fspan><\u002Fdiv>\n        <div>&nbsp;&nbsp;ui/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#5C6472\">Preact + signals, pluggable transports<\u002Fspan><\u002Fdiv>\n        <div>&nbsp;&nbsp;webapp/&nbsp;&nbsp;&nbsp;<span style=\"color:#5C6472\">→ npm <span style=\"color:#F2EDE1\">tokenmancer<\u002Fspan>, local-first HTTP/SSE<\u002Fspan><\u002Fdiv>\n        <div>&nbsp;&nbsp;extension/&nbsp;<span style=\"color:#5C6472\">→ VS Code host bridge + webviews<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#B47CFF\">proof/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#5C6472\">the tiktoken golden oracle pricing locks against<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#FFC13D\">tools/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#5C6472\">deterministic demo-repo generator<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;justify-content:center\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.14em;color:#9EFF3D;text-transform:uppercase\">One source of truth<\u002Fspan>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#AEB6C2\">Pricing — previously copied five times and drifting — now lives once in <code style=\"font-family:'JetBrains Mono',monospace;background:#0D1118;border:1px solid #232B39;padding:2px 6px;border-radius:3px;color:#D6DCE5\">core/pricing<\u002Fcode>, locked by golden tests that reproduce the Python oracle to the cent.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECURITY -->\n  <div style=\"max-width:1280px;margin:0 auto;padding:0 56px 100px;box-sizing:border-box\">\n    <div style=\"background:#0A0D13;border:1px solid #1C222E;border-radius:6px;padding:40px 44px;display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start\">\n      <div style=\"flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;color:#9EFF3D;text-transform:uppercase\">Security<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bungee',sans-serif;font-size:24px\">Local by design<\u002Fh2>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#8A93A3\">Everything runs on your machine. Covered by an automated security suite.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:2;min-width:340px;display:grid;grid-template-columns:1fr 1fr;gap:14px 32px;font-size:14px;color:#D6DCE5\">\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Loopback bind (127.0.0.1)<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Per-run token on every data route<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Host/Origin validation (DNS-rebind defense)<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Prompt redaction by default<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Workspace paths hidden by default<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#9EFF3D\">•<\u002Fspan>Path-traversal guards &amp; request limits<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid #1C222E;padding:36px 56px;max-width:1280px;margin:0 auto;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <svg sc-camel-view-box=\"0 0 128 128\" style=\"width:22px;height:22px;flex:none\">\n        <path d=\"M64 8 L104 42 L106 114 L86 103 L64 116 L42 103 L22 114 L24 42 Z\" fill=\"#5C6472\"><\u002Fpath>\n        <path d=\"M64 28 L90 52 L88 94 L64 105 L40 94 L38 52 Z\" fill=\"#06070B\"><\u002Fpath>\n      <\u002Fsvg>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C6472\">© 2026 Tokenmancer · MIT licensed<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"https://github.com/genesis-nexus/tokenmancer\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#8A93A3\" style-hover=\"color:#9EFF3D\">github.com/genesis-nexus/tokenmancer →<\u002Fa>\n  <\u002Ffooter>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
